# Kube-Prometheus-Stack Values
# This configuration deploys Prometheus, Grafana, and Alertmanager

# Prometheus Configuration
prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    
    # Resource limits
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    
    # Service monitors selector
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    
    # Enable remote write (optional)
    # remoteWrite: []

# Grafana Configuration
grafana:
  enabled: true
  
  adminUser: admin
  # adminPassword is set via terraform
  
  # Grafana service configuration
  service:
    type: ClusterIP
    port: 80
  
  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Default dashboards
  defaultDashboardsEnabled: true
  
  # Additional datasources
  additionalDataSources: []
  
  # Grafana plugins
  plugins:
    - grafana-piechart-panel
    - grafana-clock-panel
  
  # Persistence
  persistence:
    enabled: true
    size: 10Gi
  
  # Sidecar configuration for automatic dashboard loading
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
    datasources:
      enabled: true
      label: grafana_datasource

# Alertmanager Configuration
alertmanager:
  enabled: true
  
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# Node Exporter Configuration
nodeExporter:
  enabled: true

# Kube State Metrics Configuration
kubeStateMetrics:
  enabled: true

# Default Service Monitors
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    prometheus: true
    prometheusOperator: true

# Prometheus Operator Configuration
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
