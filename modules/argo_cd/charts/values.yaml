# Repository configuration
repository:
  url: "https://github.com/Sopizhenko/Neo_DevOps.git"
  name: "neo-devops"

# Application configuration
application:
  name: "django-app"
  namespace: "default"
  targetRevision: "lesson-7"
  path: "charts/django-app"
  
  # Sync policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: "5s"
        factor: 2
        maxDuration: "3m"
