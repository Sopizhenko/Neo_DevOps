global:
  domain: argocd.example.com

server:
  service:
    type: LoadBalancer
  
  extraArgs:
    - --insecure
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

applicationSet:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

dex:
  enabled: false

notifications:
  enabled: false

configs:
  params:
    server.insecure: true
  
  cm:
    # Automatic sync settings
    timeout.reconciliation: 180s
    
    # Application settings
    application.instanceLabelKey: argocd.argoproj.io/instance
    
    # Resource tracking
    application.resourceTrackingMethod: annotation
